name: template-ci

on:
  push:
  pull_request:

jobs:
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install template test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Cookiecutter hook and pruning tests
        run: pytest -q tests
      - name: Generate the default project
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          cd "$RUNNER_TEMP/generated"
          cookiecutter --no-input "$GITHUB_WORKSPACE"
      - name: Build and test the generated project
        working-directory: ${{ runner.temp }}/generated/spring-modulith-application
        run: ./gradlew test --no-daemon
